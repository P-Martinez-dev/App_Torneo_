<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ nombre_club }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="{{ url_for('inicio.inicio') }}">{{ nombre_club }}</a>
    <div class="site-header-sesion">
      {% if es_admin() %}
      <form method="post" action="{{ url_for('admin.logout') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-ghost btn-chico">Cerrar sesión</button>
      </form>
      {% else %}
      <a class="btn btn-ghost btn-chico" href="{{ url_for('admin.login') }}">Admin</a>
      {% endif %}
    </div>
  </header>
  <main class="page">
    {% with mensajes = get_flashed_messages() %}
      {% if mensajes %}
        {% for m in mensajes %}
          <p class="flash flash-error">{{ m }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
