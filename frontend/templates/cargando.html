<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cargando...</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="pantalla-carga">
    <div class="carga-contenido">
      <p class="carga-titulo">{{ nombre_club_carga }}</p>
      <p class="carga-paso" id="carga-paso">{{ estado.paso_actual or 'Conectando...' }}</p>
      <div class="carga-barra-fondo">
        <div class="carga-barra-progreso" id="carga-barra"></div>
      </div>
      <p class="carga-porcentaje" id="carga-porcentaje">0%</p>
      <div id="carga-error" class="carga-error" hidden>
        <p class="carga-paso">El servidor no responde. Puede estar caído o tardando más de lo normal.</p>
        <button type="button" class="btn btn-stamp" id="carga-reintentar">Reintentar</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    const barra = document.getElementById("carga-barra");
    const paso = document.getElementById("carga-paso");
    const pct = document.getElementById("carga-porcentaje");
    const error = document.getElementById("carga-error");
    // Adónde ir cuando el backend esté listo: la misma página (recargarla)
    // o, si se llegó acá desde un formulario, la página del formulario --
    // recargar un POST lo reenviaría.
    const destino = {{ url_destino | tojson }};
    // Si el backend no contesta NADA durante este tiempo, se deja de
    // esperar y se avisa. Despertar un servicio dormido en Render tarda
    // bastante menos que esto.
    const MS_MAX_SIN_RESPUESTA = 3 * 60 * 1000;
    let sinRespuestaDesde = null;

    function irAlDestino() {
      if (destino) { window.location.href = destino; } else { window.location.reload(); }
    }

    function rendirse() {
      paso.hidden = true;
      error.hidden = false;
    }

    // Anota que esta consulta no tuvo respuesta del backend y devuelve true
    // si ya se superó el máximo. Cuenta tanto el "sin_respuesta" que manda
    // el frontend como una consulta que falla entera: antes esta última
    // reintentaba sin contar el tiempo, y la espera se volvía infinita.
    function sinRespuestaDemasiado() {
      sinRespuestaDesde = sinRespuestaDesde || Date.now();
      return Date.now() - sinRespuestaDesde > MS_MAX_SIN_RESPUESTA;
    }

    document.getElementById("carga-reintentar").addEventListener("click", irAlDestino);

    function consultar() {
      // Le pregunta al FRONTEND (mismo origen). El frontend consulta al
      // backend del lado del servidor, con la clave interna -- que nunca
      // llega al navegador.
      fetch("{{ url_for('inicio.estado_carga') }}")
        .then(r => r.json())
        .then(data => {
          if (data.sin_respuesta) {
            if (sinRespuestaDemasiado()) {
              rendirse();
              return;
            }
          } else {
            sinRespuestaDesde = null;
          }
          const porcentaje = data.pasos_totales > 0
            ? Math.round((data.pasos_hechos / data.pasos_totales) * 100)
            : 0;
          barra.style.width = porcentaje + "%";
          pct.textContent = porcentaje + "%";
          paso.textContent = data.paso_actual || "Cargando...";

          if (data.completado) {
            paso.textContent = "Listo";
            barra.style.width = "100%";
            pct.textContent = "100%";
            // Vuelve a la página que el usuario quería ver originalmente
            setTimeout(irAlDestino, 350);
          } else {
            setTimeout(consultar, 400);
          }
        })
        .catch(() => {
          if (sinRespuestaDemasiado()) {
            rendirse();
          } else {
            setTimeout(consultar, 1000);
          }
        });
    }

    consultar();
  })();
  </script>
</body>
</html>
