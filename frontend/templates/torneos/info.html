{% extends "base.html" %}
{% block title %}{{ titulo }} · {{ nombre_club }}{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <p class="eyebrow">{{ eyebrow }}</p>
    <h1 class="display-title">{{ titulo }}</h1>
  </div>
  <div class="page-head-acciones">
    {% if es_admin() %}
    <a class="btn btn-ghost" href="{{ url_for('torneo.editar_info', cual=cual) }}">Editar</a>
    {% endif %}
    <a class="btn btn-ghost" href="{{ volver }}">Volver</a>
  </div>
</div>

<section class="detalle-seccion info-contenido">
  {{ texto | markdown }}
</section>
{% endblock %}
